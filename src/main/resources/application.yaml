app:
  name: "To-Do List Manager"
  version: "1.0.0"
  api:
    title: "To-Do List API"
    version: "2.0.0"
    description: "REST API for managing tasks, favorites, attachments and user view preferences."
    contact:
      name: "To-Do API Support"
      email: "support@todo.local"
      url: "http://localhost:8080/swagger-ui.html"
  attachments:
    upload-dir: uploads

server:
  port: 8080

spring:
  application:
    name: to-do-list-manager
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
